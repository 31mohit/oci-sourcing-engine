services:
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
    depends_on:
      - redis

  worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    command: python worker.py
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
